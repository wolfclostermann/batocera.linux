# Force the proprietary wl driver to bind BCM4360 (14e4:43a0) instead of
# the in-tree drivers, none of which support this chip revision:
#  - b43: FOUND UNSUPPORTED PHY (Analog 12, Type 11 (AC), Revision 1)
#  - brcmsmac: bcma alias table doesn't cover core revision 0x2A
#  - brcmfmac: no bcma/PCI alias for this device, chip.c lacks BCM4360 ARM CR4 constants
blacklist bcma
blacklist b43
blacklist b43legacy
blacklist ssb
blacklist bcm43xx
blacklist brcm80211
blacklist brcmfmac
blacklist brcmsmac
